services:
  - type: web
    name: accident-alarm-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build --workspace=services/api
    preDeployCommand: npx prisma migrate deploy --schema services/api/prisma/schema.prisma
    startCommand: npm run start --workspace=services/api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GUEST_TOKEN_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: WEB_APP_ORIGIN
        sync: false

  - type: worker
    name: accident-alarm-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build --workspace=services/worker
    buildCommand: npm ci && npx prisma generate --schema services/api/prisma/schema.prisma && npm run build --workspace=services/worker
    startCommand: npm run start --workspace=services/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
