services:
  - type: web
    name: accident-alarm-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=services/api
    startCommand: npx prisma migrate deploy --schema services/api/prisma/schema.prisma && npm run start --workspace=services/api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GUEST_TOKEN_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: WEB_APP_ORIGIN
        sync: false
